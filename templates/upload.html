<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"/>
  </head>
  <body>
    <div class="container py-5">
      <h2 class="text-center mb-5">📷 Upload Image</h2>
      <form id="uploadForm" action="/predict" method="POST" enctype="multipart/form-data">
        <input id="imageInput" class="form-control" type="file" name="image" accept="image/*" required/>
        <br />
        <button class="btn btn-primary w-100">Predict Emotion</button>
      </form>
      <div class="result">
        <div id="loader" style="display: none" class="text-center mt-4">
        <div class="spinner-border text-info"></div>
        <p>Predicting Emotion...</p>
      </div>
      <div id="previewCard" style="display: none" class="text-center mt-5">
        <h4>Preview</h4>
        <img id="preview" width="300" class="img-fluid shadow" />
      </div>
      {% if image %}
      <hr />
      <div class="text-center">
        <img src="{{ url_for('uploaded_file', filename=image) }}" width="350" class="img-fluid rounded shadow"/>
      </div>
      <div class="result-card">
        <div class="card mt-4 p-4 text-center">
        <h2>{{ emotion }}</h2>
        <h5>Confidence</h5>
        <div class="progress">
          <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: {{ confidence|default(0) }}%;">
            {{ confidence }} %
          </div>
        </div>
      </div>
      {% endif %}
      <div class="text-center mt-4">
        <a href="/" class="btn btn-dark"> Home </a>
      </div>
      </div>
      </div>
    </div>
    <script src="{{ url_for('static',filename='js/app.js') }}"></script>
  </body>
</html>
